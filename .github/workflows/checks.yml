name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r server/api/requirements-dev.txt
      - run: npm ci
      - run: python scripts/cloudflare.py
      - run: python -m pytest tests/test_api.py -q
      - run: python -m unittest discover -s tests -p test_vps.py
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: python tests/run_browser.py
      - run: python scripts/api.py
