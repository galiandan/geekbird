# Include in nginx's http context. The API listens on loopback only.
map $request_method $geekbird_write_ip {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $geekbird_write_ip zone=geekbird_submit:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=geekbird_records:10m rate=60r/m;
map $http_origin $geekbird_api_origin {
    default "";
    "https://geekbird.org" $http_origin;
}
# Exact preview origins are managed separately from production.
map $http_origin $geekbird_preview_origin {
    default "";
    ~^https://feat-self-hosted-booking-backend\.geekbird\.pages\.dev$ $http_origin;
    ~^https://feat-self-hosted-booking-back\.geekbird\.pages\.dev$ $http_origin;
}
log_format geekbird_api '$remote_addr - $time_local "$request_method $uri" $status $body_bytes_sent';
