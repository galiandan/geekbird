# Install as /etc/nginx/sites-available/geekbird.conf.
# Serve the release package's public/ directory, never the whole source project.
server {
    listen 54321 default_server;
    listen [::]:54321 default_server;
    server_name 47.120.64.37;
    root /var/www/geekbird/public;
    index index.html;
    autoindex off;
    charset utf-8;
    etag on;

    access_log /var/log/nginx/geekbird.access.log;
    error_log /var/log/nginx/geekbird.error.log warn;

    # config.js and unchanged asset names must revalidate after every release.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_vary on;

    location = /disclaimer { return 301 /disclaimer/; }
    location = /service { return 301 /service/; }
    location = /booking { return 301 /booking/; }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
