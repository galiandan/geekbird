# Include inside the existing HTTPS server block; leave ACME and old routes intact.
location ^~ /api/ {
    client_max_body_size 32k;
    limit_req zone=geekbird_submit burst=3 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8766;
    include /etc/nginx/snippets/geekbird-api-proxy.conf;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    add_header Access-Control-Allow-Origin $geekbird_api_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Idempotency-Key" always;
    add_header Vary Origin always;
    add_header Cache-Control no-store always;
    error_page 413 = @gb_too_large;
    error_page 429 = @gb_rate_limited;
    error_page 502 504 = @gb_unavailable;
    access_log /var/log/nginx/geekbird-api.access.log geekbird_api;
}
location = /_gb-data { return 302 /_gb-data/; }
location ^~ /_gb-data/ {
    add_header Cache-Control no-store always;
    client_max_body_size 32k;
    limit_req zone=geekbird_records burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8766;
    include /etc/nginx/snippets/geekbird-api-proxy.conf;
    access_log /var/log/nginx/geekbird-api.access.log geekbird_api;
}
location ^~ /_gb-preview/api/ {
    client_max_body_size 32k;
    limit_req zone=geekbird_submit burst=3 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8767/api/;
    include /etc/nginx/snippets/geekbird-api-proxy.conf;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    add_header Access-Control-Allow-Origin $geekbird_preview_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Idempotency-Key" always;
    add_header Vary Origin always;
    add_header Cache-Control no-store always;
    error_page 413 = @gb_preview_too_large;
    error_page 429 = @gb_preview_rate_limited;
    error_page 502 504 = @gb_preview_unavailable;
    access_log /var/log/nginx/geekbird-api.access.log geekbird_api;
}
location = /_gb-preview/_gb-data { return 302 /_gb-preview/_gb-data/; }
location ^~ /_gb-preview/_gb-data/ {
    add_header Cache-Control no-store always;
    client_max_body_size 32k;
    limit_req zone=geekbird_records burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8767/_gb-data/;
    include /etc/nginx/snippets/geekbird-api-proxy.conf;
    access_log /var/log/nginx/geekbird-api.access.log geekbird_api;
}
