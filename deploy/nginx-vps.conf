# Loaded inside Nginx's http context. Requires the IP certificate and Python service.
limit_req_zone $binary_remote_addr zone=geekbird_admin:10m rate=30r/m;

server {
    listen 54321 default_server;
    listen [::]:54321 default_server;
    server_name 47.120.64.37;
    # Always serve forms and browser credentials over trusted HTTPS.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    return 308 https://47.120.64.37$request_uri;
}

server {
    listen 443 ssl;
    include /etc/nginx/snippets/geekbird-api-locations.conf;
    include /etc/nginx/snippets/geekbird-api-errors.conf;
    listen [::]:443 ssl;
    server_name 47.120.64.37;
    ssl_certificate /etc/letsencrypt/live/geekbird-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geekbird-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/geekbird/public;
    index index.html;
    autoindex off;
    charset utf-8;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_vary on;
    client_max_body_size 16k;
    location = /config.js {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /_gb-settings { return 302 /_gb-settings/; }
    location ^~ /_gb-settings/ {
        # Keep the backend's private-page headers instead of inheriting public ones.
        add_header Cache-Control "no-store" always;
        limit_req zone=geekbird_admin burst=12 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /disclaimer { return 301 /disclaimer/; }
    location = /service { return 301 /service/; }
    location = /booking { return 301 /booking/; }
    location = /feedback { return 301 /feedback/; }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
